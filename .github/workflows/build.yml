name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK build type"
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug

  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew "CubiqLauncher:assemble${{ inputs.variant || github.event.inputs.variant || 'Debug' }}" -Darch=${{ matrix.arch }}

      - name: Upload APK for ${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ inputs.variant || github.event.inputs.variant || 'Debug' }}-${{ matrix.arch }}
          path: CubiqLauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Release Mapping
        if: (inputs.variant || github.event.inputs.variant || 'Debug') == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ matrix.arch }}
          path: CubiqLauncher/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
