name: Build Anime Launcher for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-native-exe
    paths:
      - "settings.gradle.kts"
      - "windows-desktop/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows EXE
        shell: pwsh
        run: .\gradlew.bat :windows-desktop:packageExe --no-daemon

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Launcher-Windows-EXE
          path: windows-desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 14
